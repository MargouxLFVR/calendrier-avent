
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendrier de la bonne humeur</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  padding: 12px 0 30px;
  text-align: center;
  font-family: "Trebuchet MS", sans-serif;
  background: #193b36;
  color: #fff5df;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(23px, 5vw, 38px);
  color: #ffe3a0;
  margin: 12px 8px 5px;
  text-shadow: 2px 3px 4px #0008;
}

.subtitle {
  font-size: 16px;
  margin: 5px 0 18px;
}

/* ILLUSTRATION DU CHALET */

.scene {
  position: relative;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
}

.chalet-image {
  display: block;
  width: 100%;
  height: auto;
}

/* ZONE DES 24 PORTES */

.calendar {
  position: absolute;
  left: 9%;
  top: 35%;
  width: 84%;
  height: 49%;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  grid-template-rows: repeat(4, 1fr);
  gap: 0;
}

.door {
  position: relative;
  min-width: 0;
  min-height: 0;
  padding: 0;
  border: 2px solid transparent;
  border-radius: 17%;
  background: transparent;
  cursor: pointer;
  transition: background .2s, box-shadow .2s;
  -webkit-tap-highlight-color: transparent;
}

.door:disabled {
  cursor: not-allowed;
}

/* JOURS NON ENCORE DISPONIBLES */

.door:disabled::after {
  content: "🔒";
  position: absolute;
  top: 5%;
  right: 5%;
  font-size: clamp(9px, 2vw, 17px);
  background: #fff5dfd9;
  border-radius: 50%;
  padding: 2px;
}

/* PORTE DU JOUR */

.door.today {
  border: 2px solid #fff1a1;
  background: #ffdf7530;
  animation: glow 1.4s infinite alternate;
}

@keyframes glow {
  from {
    box-shadow:
      0 0 7px #ffdf75,
      inset 0 0 8px #ffdf7560;
  }
  to {
    box-shadow:
      0 0 17px 5px #ffdf75,
      inset 0 0 15px #fff2a180;
  }
}

/* PETIT EFFET AU SURVOL */

.door:not(:disabled):hover {
  background: #ffffff20;
  border-color: #fff2a1;
}

/* FENÊTRE DES MESSAGES */

#message {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #10251fc9;
  backdrop-filter: blur(4px);
}

.message-card {
  width: 100%;
  max-width: 440px;
  padding: 28px 23px;
  border: 5px solid #d9ae60;
  border-radius: 28px;
  background: #fff5df;
  color: #743326;
  box-shadow: 0 10px 40px #0007;
  animation: pop .35s ease;
}

@keyframes pop {
  from {
    opacity: 0;
    transform: scale(.8) rotate(-2deg);
  }
  to {
    opacity: 1;
    transform: scale(1) rotate(0);
  }
}

.message-card h2 {
  color: #a12e25;
  font-family: Georgia, serif;
  font-size: 25px;
}

#dayMessage {
  font-size: 18px;
  line-height: 1.7;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.message-footer {
  margin: 20px 0;
  font-size: 15px;
}

.close {
  border: 0;
  border-radius: 25px;
  padding: 12px 25px;
  color: white;
  background: #a12e25;
  cursor: pointer;
  font-size: 16px;
  font-family: inherit;
}

.close:hover {
  background: #74251f;
}

.footer {
  margin: 18px 10px 0;
  color: #ffe7b4;
  font-size: 14px;
  line-height: 1.7;
}

/* PETITS ECRANS */

@media(max-width: 430px) {
  body {
    padding-top: 8px;
  }

  .subtitle {
    margin-bottom: 12px;
  }

  .door {
    border-radius: 15%;
  }

  .door.today {
    border-width: 1px;
  }

  .door:disabled::after {
    font-size: 9px;
  }
}

@media(prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>

<h1>✨ Calendrier de la bonne humeur ✨</h1>

<p class="subtitle">
  24 jours, 24 surprises ! 🎁
</p>

<!-- CHALET ILLUSTRE -->
<div class="scene">

  <img
    class="chalet-image"
    src="chalet.webp"
    alt="Chalet de Noël avec 24 petites portes"
  >

  <!-- LES 24 PORTES CLIQUABLES -->
  <div class="calendar" id="calendar"></div>

</div>

<!-- FENETRE DES MESSAGES -->
<div id="message" role="dialog" aria-modal="true"
     aria-labelledby="dayTitle">

  <div class="message-card">

    <h2 id="dayTitle"></h2>

    <p id="dayMessage"></p>

    <p class="message-footer">
      💖 Une petite dose de bonheur pour toi !
    </p>

    <button class="close" onclick="closeMessage()">
      Fermer ✨
    </button>

  </div>
</div>

<p class="footer">
  Fait avec beaucoup d'amour ❤️<br>
  Rendez-vous demain pour une nouvelle surprise !
</p>

<script>

// ANNEE DU CALENDRIER
const YEAR = 2026;

// TES 24 MESSAGES
const messages = [
"Ton message du 1er décembre",
"Ton message du 2 décembre",
"Ton message du 3 décembre",
"Ton message du 4 décembre",
"Ton message du 5 décembre",
"Ton message du 6 décembre",
"Ton message du 7 décembre",
"Ton message du 8 décembre",
"Ton message du 9 décembre",
"Ton message du 10 décembre",
"Ton message du 11 décembre",
"Ton message du 12 décembre",
"Ton message du 13 décembre",
"Ton message du 14 décembre",
"Ton message du 15 décembre",
"Ton message du 16 décembre",
"Ton message du 17 décembre",
"Ton message du 18 décembre",
"Ton message du 19 décembre",
"Ton message du 20 décembre",
"Ton message du 21 décembre",
"Ton message du 22 décembre",
"Ton message du 23 décembre",
"Ton message du 24 décembre ❤️"
];

// ELEMENTS DU SITE
const calendar = document.getElementById("calendar");
const messageBox = document.getElementById("message");

// DATE DU JOUR
const today = new Date();

// JOUR A ILLUMINER
let highlightedDay = null;

if (
  today.getFullYear() < YEAR ||
  (
    today.getFullYear() === YEAR &&
    today.getMonth() < 11
  )
) {
  // Avant décembre : première porte illuminée
  highlightedDay = 0;

} else if (
  today.getFullYear() === YEAR &&
  today.getMonth() === 11 &&
  today.getDate() <= 24
) {
  // Pendant décembre : porte du jour
  highlightedDay = today.getDate() - 1;
}

// CREATION DES 24 PORTES
for (let i = 0; i < 24; i++) {

  const door = document.createElement("button");

  door.className = "door";
  door.type = "button";

  // Date de déblocage
  const unlock = new Date(YEAR, 11, i + 1);

  // Vérification de disponibilité
  const available = today >= unlock;

  door.disabled = !available;

  door.setAttribute(
    "aria-label",
    "Découvrir le message du " + (i + 1) + " décembre"
  );

  // Illumination de la case du jour
  if (i === highlightedDay) {
    door.classList.add("today");
  }

  // Ouverture du message
  if (available) {

    door.addEventListener("click", () => {

      document.getElementById("dayTitle").textContent =
        "✨ Surprise du " + (i + 1) + " décembre ✨";

      document.getElementById("dayMessage").textContent =
        messages[i];

      messageBox.style.display = "flex";

    });

  }

  calendar.appendChild(door);
}

// FERMETURE DE LA FENETRE
function closeMessage() {
  messageBox.style.display = "none";
}

// FERMER EN CLIQUANT A L'EXTERIEUR
messageBox.addEventListener("click", (event) => {
  if (event.target === messageBox) {
    closeMessage();
  }
});

// FERMER AVEC LA TOUCHE ECHAP
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") {
    closeMessage();
  }
});

</script>

</body>
</html>
