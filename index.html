<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendrier de la bonne humeur</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px 12px 45px;font-family:'Trebuchet MS',sans-serif;text-align:center;background:radial-gradient(circle at 10% 15%,white 2px,transparent 3px),radial-gradient(circle at 80% 35%,white 2px,transparent 3px),radial-gradient(circle at 35% 75%,white 2px,transparent 3px),linear-gradient(145deg,#32664f,#285741,#1c4436);background-size:150px 170px,190px 210px,230px 250px,100% 100%;min-height:100vh;color:#43291e}.chalet{position:relative;max-width:850px;margin:40px auto 0;z-index:1}.roof{background:repeating-linear-gradient(0deg,#a92d36 0 18px,#b93540 18px 36px);border-radius:48% 48% 24px 24px / 80% 80% 24px 24px;padding:48px 10px 20px;border-bottom:12px solid #fff8e8;box-shadow:0 8px 16px #0004}.house{background:repeating-linear-gradient(0deg,#d99c61 0 34px,#cf8e53 34px 37px);border-radius:0 0 32px 32px;padding:18px clamp(10px,4vw,36px) 32px;box-shadow:0 10px 24px #0005}.sign{background:#fff1d2;border:4px solid #e9bd77;border-radius:26px;padding:14px;margin:0 auto 20px;max-width:580px;box-shadow:0 4px 0 #9e623b}h1{font-size:clamp(22px,5vw,36px);margin:0 0 6px}p{margin:6px 0}.lights{font-size:clamp(16px,4vw,30px);letter-spacing:4px}.doors{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(8px,2vw,18px)}.door{position:relative;min-width:0;aspect-ratio:1/1.05;border:3px solid #fff5ce99;border-radius:24px;color:white;font: bold clamp(20px,5vw,36px) 'Trebuchet MS';box-shadow:0 5px 0 #653c2b, inset 0 0 0 3px #0001;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.door span{font-size:clamp(18px,4vw,32px)}.door:after{content:'';position:absolute;right:8%;top:55%;width:9px;height:9px;background:#ffdb75;border-radius:50%;box-shadow:0 1px 3px #0008}.door.locked{cursor:default;filter:saturate(.85)}.door.today{outline:4px solid #ffe580;box-shadow:0 0 24px 8px #ffdb70,0 5px 0 #653c2b}.door:not(.locked):hover{transform:translateY(-3px)}.floating{position:fixed;inset:0;pointer-events:none;overflow:hidden}.floating span{position:absolute;font-size:clamp(22px,4vw,48px);animation:float 4s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(12px) rotate(10deg)}}dialog{border:4px solid #d8ad65;border-radius:26px;background:#fff7e7;color:#43291e;width:min(92vw,650px);max-height:90vh;padding:24px;box-shadow:0 10px 40px #0005;overflow:auto}dialog::backdrop{background:#10291edb}#message{white-space:pre-wrap;line-height:1.55;font-size:18px;overflow-wrap:anywhere}video,img{display:block;max-width:100%;max-height:60vh;margin:15px auto;border-radius:14px}#close{border:0;border-radius:20px;background:#a92d36;color:white;padding:12px 24px;font-weight:bold;cursor:pointer}.confetti{position:fixed;top:-30px;z-index:999;pointer-events:none;animation:fall 3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style></head><body><div class="floating" id="floating"></div><main class="chalet"><div class="roof"><div style="font-size:42px">☃️</div><div class="lights">🔴 🟡 🟢 🔵 🟡 🔴 🟢</div></div><div class="house"><div class="sign"><h1>Calendrier de la bonne humeur</h1><p>24 jours, 24 surprises ! 🎁</p></div><div class="doors" id="doors"></div></div></main><dialog id="popup"><h2 id="dayTitle"></h2><div id="message"></div><div id="media"></div><button id="close">Fermer ❤️</button></dialog><script>
const YEAR=2026;
const messages=[
`Qu'est ce qui est meilleur qu'un fondant au chocolat de Mathilde ??\nDeux fondants au chocolats !!!!!!`,
`T'as déjà vu une chaise qui porte une sardine ?? Moi non, mais j'ai déjà vu un banc de saumon...`,
`Le savais-tu : Le Guatemala est connu pour comprendre 23 langues mayas !`,
`Qui a dit un jour :\n"Moi je gère très bien l'échec :\n- 2 évals d'UGP ratées - 1 dette en L3 - Un rattrapage d'évaluation clinique en L2" ?? (Indice : c'est pas Capu ni Blanche ni Alix ni Margaux ni toi)`,
`J'espère que ton microbiote supportera aussi bien l'alimentation guatemaltèque que la béninoise... remember la chichi en pleine nature à la ferme et tes fous-rires de moqueuse !`,
`Comment appelle-t-on une chauve souris avec une perruque ?\nUne souris !`,
`Pourquoi n'y a t-il plus de mammouths sur la terre ? - Parce qu'il y a plus de pappouth !!`,
`Au fait il va comment le insta de Colyne ?`,
`Tic Tac Tic Tac ... M-1 avant ton BITHDAY LA QUEEEEEN !!! Profite des dernières semaines qu'il reste avant ton quart de siècle... Mais je t'embêeeeeeete, ce monde a de la chance de te connaître depuis bientôt 25ans ^^`,
`Tu te souviens quand tu as découvert que Blanche avais des sœurs au bout d'un an ?? Un des meilleurs premiers fous rires`,
`Je me rappellerai toujours la première fois qu'on s'est parlées... . Tu m'as tout de suite plu et paru curieuse et attentionnée. Je m'étais pas trompée ! Si on m'avait dit qu'il se serait passé TOUT CA j'y aurai jamais cru ... (PS : ça fait 5 ANS)`,
`Pourquoi les girafes ont-elles un long cou ? - Parce qu'elles puent des fesses ...`,
`Qu'est ce qui est transparent et court dans un champ ? - Un troupeau de vitres !!`,
`Ferme les yeux et revois la scène : Un matin difficile en cours, Blanche arrive presque en retard... dans la même tenue que la veille au soir. Sauf que la veille ... c'était son baptême !!`,
`Liste non exhaustive des belles choses que tu as accompli :\n\n- Devenir sage-femme\n- Etre une amie hors du commun\n- Le GATEAU COOKIE\n- Partir à l'aventure à Mayotte\n- Devenir une tata ET marraine accomplie\n- Faire faire Nice-Paris-Cotonou à un mec à qui t'a rien demandé\n- Passer le permis bateau\n- Manger des trucs pas comestible au Benin\n- Porter un serpent même si c'était la pire expérience\n- Prendre confiance en toi tout au long de ces aventures, c'est fou la femme que tu deviens !!`,
``,
`Comment savoir quand un sapin est en colère ? - Il a les boules`,
`Que font les brosses à dent le 14 juillet ? - Un feu dentifrice !`,
``,
`MOI J'AI CONFIANCE`,
`U patient s'adresse à son médecin :\n- "J'ai très mal à l'oeil gauche quand je bois mon café le matin."\n- "Vous avez essayé d'enlever la cuillère de la tasse ?"`,
`Pourquoi peint-on un chat à Noël ? - Pour faire un chapeint de Noël !!`,
``,
`Et voilà, nous arrivons au bout de ces 24 jours de blagues approximatives, de souvenirs, de dossiers... J'espère que ça aura réussi à te faire sourire un peu tous les jours ! Et j'espère avoir encore pleins de nouvelles anecdotes à vivre et à utiliser dans les prochains secret santa... ! Eclate-toi dans toutes ces aventures que tu vis encore, continue de rire et de t'émerveiller et bravo de devenir la femme que tu es ! Profite bien du reste de ton voyage et JOYEUX NOEL ma Mathilde !!`];
const videos={16:['jour16.mp4'],19:['jour19-1.mp4','jour19-2.mp4','jour19-3.mp4'],20:['jour20.mp4'],23:['jour23.mp4']};
const popup=document.querySelector('#popup'),media=document.querySelector('#media');
function openDay(d){document.querySelector('#dayTitle').textContent=d+' décembre 🎁';document.querySelector('#message').textContent=messages[d-1];media.replaceChildren();if(videos[d]){let i=0;const v=document.createElement('video');v.controls=true;v.playsInline=true;v.src=videos[d][0];v.addEventListener('ended',()=>{if(++i<videos[d].length){v.src=videos[d][i];v.play().catch(()=>{});}});media.append(v);}if(d===24){const img=document.createElement('img');img.src='jour24.webp';img.alt='Photo souvenir de Noël';media.append(img);}popup.showModal();if(d===24){for(let i=0;i<55;i++){let s=document.createElement('span');s.className='confetti';s.textContent=['❤️','✨','💛'][i%3];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()+'s';document.body.append(s);setTimeout(()=>s.remove(),4200);}}}
document.querySelector('#close').onclick=()=>popup.close();popup.addEventListener('close',()=>media.replaceChildren());
const now=new Date(),start=new Date(YEAR,11,1),highlight=now<start?1:now.getFullYear()===YEAR&&now.getMonth()===11?now.getDate():0;
const colors=['#c43c45','#218653','#dca02b','#168f96'],icons=['🎁','⭐','🎄','🍭','🦌','⛄','🔔','🎅','🍬','🧝','✨','🎀'];
for(let d=1;d<=24;d++){const b=document.createElement('button');b.className='door';b.style.background=colors[(d-1+Math.floor((d-1)/4))%4];b.innerHTML=d+'<span>'+icons[(d-1)%icons.length]+'</span>';if(d===highlight)b.classList.add('today');if(now<new Date(YEAR,11,d)){b.classList.add('locked');b.onclick=()=>alert('Patience ! Cette surprise s’ouvrira le '+d+' décembre 🎄');}else b.onclick=()=>openDay(d);document.querySelector('#doors').append(b);}
['⭐','🍭','🎁','🧝','🍬','✨','🎀','🍫','🌟','🦌'].forEach((e,i)=>{let s=document.createElement('span');s.textContent=e;s.style.left=(i%2?91:2)+'%';s.style.top=(5+Math.floor(i/2)*19)+'%';s.style.animationDelay=i*.3+'s';document.querySelector('#floating').append(s);});
</script></body></html>
