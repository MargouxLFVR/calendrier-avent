
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendrier de la bonne humeur</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  padding:25px 14px 45px;
  font-family: "Trebuchet MS", sans-serif;
  text-align:center;
  color:#49385f;
  background:linear-gradient(145deg,#fff5dc,#e3f5ff,#f8e5ff);
  min-height:100vh;
}
h1 {
  color:#7650b9;
  font-size:clamp(27px,6vw,43px);
  margin:15px 0 8px;
}
.subtitle { font-size:16px; margin-bottom:25px; }
.decoration { font-size:30px; letter-spacing:8px; }
.grid {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
  max-width:560px;
  margin:25px auto;
}
.door {
  min-width:0;
  min-height:112px;
  border:3px solid white;
  border-radius:19px;
  color:white;
  cursor:pointer;
  box-shadow:0 5px 12px #55416b30;
  transition:transform .2s, box-shadow .2s;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-family:inherit;
}
.door:not(:disabled):hover {
  transform:translateY(-5px) rotate(-2deg);
  box-shadow:0 9px 18px #55416b40;
}
.door:disabled { cursor:not-allowed; opacity:.58; }
.door .picture { font-size:35px; }
.door .number { font-weight:bold; font-size:16px; }
.door:nth-child(6n+1) { background:#ed8b64; }
.door:nth-child(6n+2) { background:#54bcb5; }
.door:nth-child(6n+3) { background:#8d78cf; }
.door:nth-child(6n+4) { background:#e7b94d; }
.door:nth-child(6n+5) { background:#e879a4; }
.door:nth-child(6n) { background:#5796d5; }
#message {
  display:none;
  max-width:440px;
  margin:25px auto;
  padding:25px;
  background:white;
  border:3px solid #e9d6ff;
  border-radius:24px;
  box-shadow:0 8px 25px #55416b25;
  animation:pop .35s ease;
}
@keyframes pop {
  from { opacity:0; transform:scale(.85); }
  to { opacity:1; transform:scale(1); }
}
#message h2 { color:#8058bb; }
#dayMessage {
  font-size:18px;
  line-height:1.7;
  white-space:pre-wrap;
}
.close {
  border:0;
  border-radius:20px;
  padding:10px 22px;
  color:white;
  background:#8d78cf;
  cursor:pointer;
  font-size:15px;
}
.footer { margin-top:30px; font-size:14px; }
@media(max-width:370px) {
  .grid { gap:7px; }
  .door { min-height:90px; }
  .door .picture { font-size:28px; }
}
</style>
</head>
<body>

<div class="decoration">⭐ 🎁 ❄️ 🎄</div>
<h1>✨ Calendrier de la bonne humeur ✨</h1>
<p class="subtitle">
  24 jours, 24 surprises et plein de bonheur ! 💌
</p>

<div class="grid" id="calendar"></div>

<div id="message">
  <h2 id="dayTitle"></h2>
  <p id="dayMessage"></p>
  <p>💖 Une petite dose de bonheur pour toi !</p>
  <button class="close" onclick="closeMessage()">Fermer ✨</button>
</div>

<p class="footer">
  Fait avec beaucoup d'amour ❤️<br>
  Rendez-vous demain pour une nouvelle surprise !
</p>

<script>
// ✏️ REMPLACE LES TEXTES PAR TES 24 MESSAGES

const messages = [
"Ton message du 1er décembre",
"Ton message du 2 décembre",
"Ton message du 3 décembre",
"Ton message du 4 décembre",
"Ton message du 5 décembre",
"Ton message du 6 décembre",
"Ton message du 7 décembre",
"Ton message du 8 décembre",
"Ton message du 9 décembre",
"Ton message du 10 décembre",
"Ton message du 11 décembre",
"Ton message du 12 décembre",
"Ton message du 13 décembre",
"Ton message du 14 décembre",
"Ton message du 15 décembre",
"Ton message du 16 décembre",
"Ton message du 17 décembre",
"Ton message du 18 décembre",
"Ton message du 19 décembre",
"Ton message du 20 décembre",
"Ton message du 21 décembre",
"Ton message du 22 décembre",
"Ton message du 23 décembre",
"Ton message du 24 décembre ❤️"
];

const decorations = [
"🎁","🍭","⛄","⭐","🦌","🎄",
"🔔","🧸","❄️","🍬","🛷","🎀",
"🧦","🕯️","🍪","🌟","🎅","🦊",
"🎉","🍫","🧤","🛎️","🎊","💝"
];

const today = new Date();
const calendar = document.getElementById("calendar");

for(let i=0; i<24; i++){
  const door = document.createElement("button");
  door.className = "door";

  const unlock = new Date(2026, 11, i+1);
  const available =
    today >= new Date(2026, 11, i+1);

  door.disabled = !available;

  door.innerHTML = `
    <span class="picture">${available ? decorations[i] : "🔒"}</span>
    <span class="number">${i+1} décembre</span>
  `;

  if(available){
    door.onclick = () => {
      document.getElementById("dayTitle").textContent =
        "✨ Surprise du "+(i+1)+" décembre ✨";

      document.getElementById("dayMessage").textContent =
        messages[i];

      document.getElementById("message").style.display = "block";

      document.getElementById("message").scrollIntoView({
        behavior:"smooth",
        block:"center"
      });
    };
  }

  calendar.appendChild(door);
}

function closeMessage(){
  document.getElementById("message").style.display="none";
}
</script>
</body>
</html>
